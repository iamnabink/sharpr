# Sharpr — production compose file using the prebuilt images from Docker Hub.
#
#   mkdir sharpr && cd sharpr
#   curl -fsSLO https://raw.githubusercontent.com/iamnabink/sharpr/main/compose.yml
#   curl -fsSL  https://raw.githubusercontent.com/iamnabink/sharpr/main/.env.example -o .env
#   docker compose up -d
#
# Settings come from the .env file next to this one. See README.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharpr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharpr}
      POSTGRES_DB: ${POSTGRES_DB:-sharpr}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharpr} -d ${POSTGRES_DB:-sharpr}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: iamnabink/sharpr-api:${SHARPR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sharpr}:${POSTGRES_PASSWORD:-sharpr}@db:5432/${POSTGRES_DB:-sharpr}
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_DIR: /data
      STORAGE_LOCAL_PATH: /data/recordings
      SEED_DIR: /app/seed
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-sharpr}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - sharpr_data:/data

  web:
    image: iamnabink/sharpr-web:${SHARPR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SHARPR_PORT:-3000}:3000"

volumes:
  db_data:
  sharpr_data:
