# Developer compose file: builds the images from this checkout. End users use compose.yml.
# ./start.sh and ./stop.sh pass -f docker-compose.yml explicitly.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharpr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharpr}
      POSTGRES_DB: ${POSTGRES_DB:-sharpr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharpr} -d ${POSTGRES_DB:-sharpr}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  api:
    image: iamnabink/sharpr-api:${SHARPR_TAG:-latest}
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sharpr}:${POSTGRES_PASSWORD:-sharpr}@db:5432/${POSTGRES_DB:-sharpr}
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_DIR: /data
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /data/recordings
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-sharpr}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      SEED_DIR: /app/seed
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  web:
    image: iamnabink/sharpr-web:${SHARPR_TAG:-latest}
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Optional S3-compatible storage for recordings: docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
  miniodata:
