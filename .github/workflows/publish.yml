name: Publish images

# Builds multi-arch images and pushes them to Docker Hub as
#   iamnabink/sharpr-api  and  iamnabink/sharpr-web
# Tags: latest (main), the git sha, and vX.Y.Z for version tags.
# Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN; skips cleanly when they are absent.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  NAMESPACE: iamnabink

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.s.outputs.enabled }}
    steps:
      - id: s
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::DOCKERHUB_TOKEN not set — skipping publish"; fi

  publish:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: sharpr-api
            context: apps/api
          - name: sharpr-web
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
