# Sharpr with prebuilt images from Docker Hub — no source checkout needed.
#
#   mkdir sharpr && cd sharpr
#   curl -fsSLO https://raw.githubusercontent.com/iamnabink/sharpr/main/docker-compose.hub.yml
#   SECRET_KEY=$(openssl rand -hex 32) docker compose -f docker-compose.hub.yml up -d
#
# Then open http://localhost:3000. Put SECRET_KEY and the POSTGRES_* values in a .env file
# next to this file to make them permanent. Pin a version with SHARPR_TAG=v1.0.0.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sharpr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sharpr}
      POSTGRES_DB: ${POSTGRES_DB:-sharpr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sharpr} -d ${POSTGRES_DB:-sharpr}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: iamnabink/sharpr-api:${SHARPR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sharpr}:${POSTGRES_PASSWORD:-sharpr}@db:5432/${POSTGRES_DB:-sharpr}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. SECRET_KEY=$(openssl rand -hex 32)}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_LOCAL_PATH: /data/recordings
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-sharpr}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DIR: /app/seed
    volumes:
      - recordings:/data/recordings

  web:
    image: iamnabink/sharpr-web:${SHARPR_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${SHARPR_PORT:-3000}:3000"

volumes:
  pgdata:
  recordings:
